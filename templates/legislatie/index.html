{% extends "base.html" %}
{% block title %}Legislație rutieră{% endblock %}

{% block content %}
<h1>Legislație rutieră</h1>
<p>Capitolele Codului Rutier, explicate pe scurt.</p>
<div class="grid">
  {% for c in capitole %}
    <a class="card link-card" href="{{ url_for('capitol', slug=c.slug) }}">
      <h2>{{ c.titlu }}</h2>
      <p>{{ c.rezumat }}</p>
    </a>
  {% endfor %}
</div>
{% endblock %}
