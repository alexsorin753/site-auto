<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Acasă{% endblock %} · {{ site_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  {% set ep = request.endpoint or '' %}
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="{{ url_for('acasa') }}">{{ site_name }}</a>
      <button class="menu-btn" id="menu-btn" aria-label="Meniu" aria-expanded="false">☰</button>
      <nav id="nav" class="nav">
        <a href="{{ url_for('chestionare') }}" class="{{ 'activ' if ep.startswith('chestionar') }}">Chestionare</a>
        <a href="{{ url_for('legislatie') }}" class="{{ 'activ' if ep in ('legislatie', 'capitol') }}">Legislație</a>
        <a href="{{ url_for('indicatoare') }}" class="{{ 'activ' if ep == 'indicatoare' }}">Indicatoare</a>
        <a href="{{ url_for('blog') }}" class="{{ 'activ' if ep == 'blog' }}">Blog</a>
        <a href="{{ url_for('despre') }}" class="{{ 'activ' if ep == 'despre' }}">Despre</a>
        <button class="tema-btn" id="tema-btn" aria-label="Schimbă tema">◐</button>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© {{ site_name }}. Conținut cu scop educativ; consultă întotdeauna textele oficiale ale legislației.</p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
